name: Full Audit

on:
  workflow_dispatch:
    inputs:
      prayer:
        description: "الصلاة المراد اختبارها (سيناريو custom)"
        type: choice
        options: [fajr, dhuhr, asr, maghrib, isha]
        default: dhuhr
      silent_start:
        description: "بدء الصامت: كم دقيقة بعد بدء الأذان"
        default: "0.5"
      silent_end:
        description: "نهاية الصامت: كم دقيقة بعد بدء الأذان"
        default: "1.5"
      ringer_before:
        description: "وضع الهاتف قبل الأذان"
        type: choice
        options: [normal, vibrate]
        default: normal
      dnd_granted:
        description: "صلاحية عدم الإزعاج ممنوحة؟"
        type: boolean
        default: true
      test_date:
        description: "تاريخ الاختبار YYYY-MM-DD (فارغ = اليوم)"
        default: ""
  push:
    branches: [ main, master ]

jobs:
  # ───────────── 1) البناء والفحص الثابت ─────────────
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare
        run: |
          chmod +x gradlew
          mkdir -p report

      - name: Debug build with all warnings
        run: |
          ./gradlew clean assembleDebug --warning-mode all > report/build.log 2>&1 && echo PASS > report/build.status || echo FAIL > report/build.status
          tail -n 40 report/build.log

      - name: Lint
        run: |
          ./gradlew lintDebug > report/lint.log 2>&1 && echo PASS > report/lint.status || echo FAIL > report/lint.status

      - name: Unit tests
        run: |
          ./gradlew testDebugUnitTest > report/unit.log 2>&1 && echo PASS > report/unit.status || echo FAIL > report/unit.status

      - name: Release build
        run: |
          ./gradlew assembleRelease > report/release.log 2>&1 && echo PASS > report/release.status || echo FAIL > report/release.status

      - name: APK info and static scan
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump badging "$APK" > report/badging.txt || true
          grep -E "^package:|sdkVersion|targetSdkVersion" report/badging.txt > report/sdk.txt || true
          grep "uses-permission" report/badging.txt > report/permissions.txt || true
          grep -rEn "AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|api[_-]?key[[:space:]]*=[[:space:]]*\"" app/src > report/secrets.txt || true
          grep -rEn "Thread\.sleep|runBlocking|GlobalScope|\.printStackTrace\(\)|TODO|FIXME" app/src > report/code_smells.txt || true

      - name: Write analysis report
        if: always()
        run: |
          XML=app/build/reports/lint-results-debug.xml
          {
            echo "# Static Analysis"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            for f in build lint unit release; do
              echo "| $f | $(cat report/$f.status 2>/dev/null || echo NOT RUN) |"
            done
            echo
            echo "## SDK"
            cat report/sdk.txt 2>/dev/null
            echo
            if [ -f "$XML" ]; then
              echo "## Lint: errors=$(grep -c 'severity="Error"' $XML || true) warnings=$(grep -c 'severity="Warning"' $XML || true)"
              grep -o 'id="[A-Za-z]*"' $XML | sort | uniq -c | sort -rn | head -20
            fi
          } > report/ANALYSIS.md
          cat report/ANALYSIS.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-report
          path: |
            report/
            app/build/reports/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-for-emulator
          path: app/build/outputs/apk/debug/*.apk

      - name: Stop here if the build failed
        run: grep -q PASS report/build.status

  # ───────────── 2) سيناريوهات المحاكي (وقت حقيقي) ─────────────
  emulator:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["custom","silent_with_dnd","silent_no_dnd","silent_disabled","ringer_vibrate","vibration_only","isha_rollover","all_prayers_day","clock_tz_boot","ui_stress"]' || '["silent_with_dnd","silent_no_dnd","silent_disabled","ringer_vibrate","vibration_only","isha_rollover","all_prayers_day","clock_tz_boot","ui_stress"]') }}
        api: [34]
        include:
          - scenario: silent_with_dnd
            api: 28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk-for-emulator
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run scenario on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API_LEVEL: ${{ matrix.api }}
          IN_PRAYER: ${{ inputs.prayer }}
          IN_S: ${{ inputs.silent_start }}
          IN_E: ${{ inputs.silent_end }}
          IN_RINGER: ${{ inputs.ringer_before }}
          IN_DND: ${{ inputs.dnd_granted }}
          IN_DATE: ${{ inputs.test_date }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 .github/scripts/audit.py ${{ matrix.scenario }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-${{ matrix.scenario }}-api${{ matrix.api }}
          path: report/

  # ───────────── 3) التقرير النهائي الموحّد ─────────────
  summary:
    needs: emulator
    if: always() && needs.emulator.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: scenario-*
          path: all-reports
      - name: Combined report
        run: python3 .github/scripts/audit.py summary all-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FULL-SUMMARY
          path: all-reports/FULL_SUMMARY.md
