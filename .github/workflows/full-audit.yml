name: Full Audit

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare
        run: |
          chmod +x gradlew
          mkdir -p report

      - name: Debug build with all warnings
        run: |
          ./gradlew clean assembleDebug --warning-mode all > report/build.log 2>&1 && echo PASS > report/build.status || echo FAIL > report/build.status
          tail -n 40 report/build.log

      - name: Lint
        run: |
          ./gradlew lintDebug > report/lint.log 2>&1 && echo PASS > report/lint.status || echo FAIL > report/lint.status

      - name: Unit tests
        run: |
          ./gradlew testDebugUnitTest > report/unit.log 2>&1 && echo PASS > report/unit.status || echo FAIL > report/unit.status

      - name: Release build (R8 check)
        run: |
          ./gradlew assembleRelease > report/release.log 2>&1 && echo PASS > report/release.status || echo FAIL > report/release.status

      - name: APK info and static scan
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump badging "$APK" > report/badging.txt || true
          grep -E "^package:|sdkVersion|targetSdkVersion" report/badging.txt > report/sdk.txt || true
          grep "uses-permission" report/badging.txt > report/permissions.txt || true
          grep -rEn "AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|api[_-]?key[[:space:]]*=[[:space:]]*\"" app/src > report/secrets.txt || true
          grep -rEn "Thread\.sleep|runBlocking|GlobalScope|\.printStackTrace\(\)|TODO|FIXME" app/src > report/code_smells.txt || true

      - name: Write analysis report
        if: always()
        run: |
          XML=app/build/reports/lint-results-debug.xml
          {
            echo "# Static Analysis"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            for f in build lint unit release; do
              echo "| $f | $(cat report/$f.status 2>/dev/null || echo NOT RUN) |"
            done
            echo
            echo "## SDK"
            cat report/sdk.txt 2>/dev/null
            echo
            echo "## Permissions"
            cat report/permissions.txt 2>/dev/null
            echo
            if [ -f "$XML" ]; then
              echo "## Lint: errors=$(grep -c 'severity="Error"' $XML || true) warnings=$(grep -c 'severity="Warning"' $XML || true)"
              echo "Top issues:"
              grep -o 'id="[A-Za-z]*"' $XML | sort | uniq -c | sort -rn | head -20
            fi
            echo
            echo "## Deprecated / future-risk warnings"
            grep -Ei "deprecat|will be removed|incubating" report/build.log | sort -u | head -40
            echo
            echo "## Release (R8) errors"
            grep -E "error:|Missing class|R8|FAILED" -A2 report/release.log | head -30
            echo
            echo "## Possible hardcoded secrets"
            head -n 10 report/secrets.txt
            echo
            echo "## Code smells (count)"
            wc -l < report/code_smells.txt
            echo
            echo "## Build errors"
            grep -E "error:|e: |What went wrong" -A3 report/build.log | head -n 40
          } > report/ANALYSIS.md
          cat report/ANALYSIS.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-report
          path: |
            report/
            app/build/reports/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-for-emulator
          path: app/build/outputs/apk/debug/*.apk

  emulator:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [28, 31, 34, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk-for-emulator
          path: app/build/outputs/apk/debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/emulator_check.sh

      - name: Report for this Android version
        if: always()
        run: |
          {
            echo "# Android API ${{ matrix.api }}"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            for f in install launch alarms monkey crash anr; do
              echo "| $f | $(cat report/$f.status 2>/dev/null || echo NOT RUN) |"
            done
            echo
            cat report/details.txt 2>/dev/null
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api-${{ matrix.api }}
          path: report/
